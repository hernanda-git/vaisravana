[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaisravana"
version = "0.1.0"
description = "Project Vaiśravaṇa — stability-first, high-WR crypto-futures trading system (documentation-complete design)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
